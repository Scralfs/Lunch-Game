<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Lunchbox – Brain Games</title>
  <meta name="description" content="Bite-sized brain games for your lunch break. Works offline.">
  <meta name="theme-color" content="#14121f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lunchbox">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <main id="view" class="view"></main>

    <nav id="tabbar" class="tabbar" aria-label="Main">
      <button data-tab="home" class="tab is-active"><span class="tab-ico">🏠</span><span>Home</span></button>
      <button data-tab="games" class="tab"><span class="tab-ico">🧩</span><span>Games</span></button>
      <button data-tab="stats" class="tab"><span class="tab-ico">📊</span><span>Stats</span></button>
      <button data-tab="settings" class="tab"><span class="tab-ico">⚙️</span><span>Settings</span></button>
    </nav>
  </div>

  <!-- Game screen -->
  <section id="game-screen" class="game-screen" hidden>
    <header class="game-bar">
      <button id="game-back" class="icon-btn" aria-label="Back to menu">←</button>
      <div class="game-title" id="game-title"></div>
      <div class="game-status" id="game-status"></div>
    </header>
    <div id="game-root" class="game-root"></div>
  </section>

  <!-- Intro / results sheet -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card" id="sheet-card"></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="js/core.js"></script>
  <script src="js/games/memory-match.js"></script>
  <script src="js/games/pattern-recall.js"></script>
  <script src="js/games/number-flash.js"></script>
  <script src="js/games/n-back.js"></script>
  <script src="js/games/make-24.js"></script>
  <script src="js/games/quick-maths.js"></script>
  <script src="js/games/target-number.js"></script>
  <script src="js/games/colour-clash.js"></script>
  <script src="js/games/number-hunt.js"></script>
  <script src="js/games/odd-colour.js"></script>
  <script src="js/games/word-scramble.js"></script>
  <script src="js/games/missing-vowels.js"></script>
  <script src="js/games/word-climb.js"></script>
  <script src="js/games/sudoku.js"></script>
  <script src="js/games/crowns.js"></script>
  <script src="js/games/sun-moon.js"></script>
  <script src="js/games/reaction.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
